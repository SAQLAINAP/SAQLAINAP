# Refreshes assets/pulse.svg (the "GitHub pulse" stats panel) once a day.
name: pulse

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools/readme
      - run: node tools/readme/pulse.mjs
        env:
          GH_PULSE: ${{ github.token }}
      - name: Commit if the panel changed
        run: |
          if git diff --quiet -- assets/pulse.svg; then echo "pulse unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse.svg
          git commit -m "pulse: refresh stats"
          git push
