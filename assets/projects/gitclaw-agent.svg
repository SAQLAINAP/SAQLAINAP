<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-gitclaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid-gitclaw" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#14160d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g-gitclaw)"/>
  <rect width="800" height="500" fill="url(#grid-gitclaw)"/>

  <!-- git branch + PR agent on the right -->
  <g transform="translate(490 80)" stroke="#14160d" stroke-width="4" fill="none">
    <!-- main branch line -->
    <line x1="40" y1="30" x2="40" y2="340"/>
    <!-- feature branch curve -->
    <path d="M40 90 C 40 130, 160 130, 160 170 L 160 260 C 160 300, 40 300, 40 340"/>

    <!-- nodes -->
    <g fill="#fff4ec">
      <circle cx="40"  cy="30"  r="14"/>
      <circle cx="40"  cy="90"  r="14"/>
      <circle cx="160" cy="170" r="14"/>
      <circle cx="160" cy="220" r="14"/>
      <circle cx="160" cy="260" r="14"/>
      <circle cx="40"  cy="340" r="14"/>
    </g>

    <!-- PR chip -->
    <g fill="#14160d" stroke="none">
      <rect x="200" y="200" width="120" height="46" rx="8"/>
    </g>
    <g stroke="none" font-family="'JetBrains Mono',monospace" font-weight="700">
      <text x="212" y="220" font-size="11" fill="#ec4899">PR #42</text>
      <text x="212" y="238" font-size="12" fill="#fbd535">agent-draft</text>
    </g>

    <!-- claw / agent glyph -->
    <g transform="translate(240 20)" stroke="#14160d" stroke-width="4" fill="#fff4ec">
      <rect x="0" y="0" width="90" height="90" rx="14"/>
      <g fill="#14160d" stroke="none">
        <rect x="18" y="24" width="14" height="14"/>
        <rect x="58" y="24" width="14" height="14"/>
        <path d="M20 60 Q 45 78 70 60 L 70 66 Q 45 84 20 66 Z"/>
      </g>
      <!-- lime aura -->
      <circle cx="45" cy="45" r="52" fill="none" stroke="#d1e030" stroke-width="3" stroke-dasharray="4 6"/>
    </g>
  </g>

  <!-- text plate -->
  <g font-family="'Oswald','Arial Narrow',Impact,sans-serif">
    <text x="60" y="220" fill="#14160d" opacity="0.75" font-size="14" letter-spacing="4" font-family="'JetBrains Mono',monospace">SAQLAINAP · ARENA</text>
    <text x="60" y="290" fill="#fff4ec" font-size="66" font-weight="700">GITCLAW AGENT</text>
    <text x="60" y="330" fill="#14160d" opacity="0.9" font-size="22" font-family="'JetBrains Mono',monospace">autonomous PR-review agent</text>
    <rect x="60" y="360" width="80" height="5" fill="#14160d"/>
  </g>
</svg>
