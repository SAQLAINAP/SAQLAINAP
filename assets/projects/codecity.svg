<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-codecity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid-codecity" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#14160d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g-codecity)"/>
  <rect width="800" height="500" fill="url(#grid-codecity)"/>

  <!-- isometric city / district skyline -->
  <g transform="translate(480 90)" stroke="#14160d" stroke-width="3.5" stroke-linejoin="round">
    <!-- ground pad -->
    <path d="M0 260 L140 190 L280 260 L140 330 Z" fill="#14160d" opacity="0.15"/>
    <!-- back tall tower -->
    <g>
      <path d="M110 60  L170 30  L170 210 L110 240 Z" fill="#fff4ec"/>
      <path d="M170 30  L230 60  L230 240 L170 210 Z" fill="#e6d5c1"/>
      <path d="M110 60  L170 30  L230 60  L170 90 Z" fill="#fbd535"/>
      <g fill="#14160d" opacity="0.7">
        <rect x="120" y="110" width="10" height="10"/>
        <rect x="140" y="100" width="10" height="10"/>
        <rect x="120" y="140" width="10" height="10"/>
        <rect x="140" y="130" width="10" height="10"/>
        <rect x="120" y="170" width="10" height="10"/>
        <rect x="140" y="160" width="10" height="10"/>
        <rect x="180" y="80"  width="10" height="10"/>
        <rect x="200" y="90"  width="10" height="10"/>
        <rect x="180" y="120" width="10" height="10"/>
        <rect x="200" y="130" width="10" height="10"/>
        <rect x="180" y="160" width="10" height="10"/>
        <rect x="200" y="170" width="10" height="10"/>
      </g>
    </g>
    <!-- left mid tower -->
    <g>
      <path d="M30 170 L80 145 L80 275 L30 300 Z" fill="#9eef80"/>
      <path d="M80 145 L130 170 L130 300 L80 275 Z" fill="#7bd865"/>
      <path d="M30 170 L80 145 L130 170 L80 195 Z" fill="#d1e030"/>
    </g>
    <!-- right short building -->
    <g>
      <path d="M200 200 L245 178 L245 285 L200 308 Z" fill="#fff4ec"/>
      <path d="M245 178 L290 200 L290 307 L245 285 Z" fill="#e6d5c1"/>
      <path d="M200 200 L245 178 L290 200 L245 222 Z" fill="#22d3ee"/>
    </g>
  </g>

  <!-- text plate -->
  <g font-family="'Oswald','Arial Narrow',Impact,sans-serif">
    <text x="60" y="220" fill="#14160d" opacity="0.75" font-size="14" letter-spacing="4" font-family="'JetBrains Mono',monospace">SAQLAINAP · ARENA</text>
    <text x="60" y="290" fill="#fff4ec" font-size="70" font-weight="700">CODECITY</text>
    <text x="60" y="330" fill="#14160d" opacity="0.9" font-size="22" font-family="'JetBrains Mono',monospace">your repo, as a living city</text>
    <rect x="60" y="360" width="80" height="5" fill="#14160d"/>
  </g>
</svg>
