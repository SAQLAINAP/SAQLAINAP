<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-resume-forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1e030"/>
      <stop offset="1" stop-color="#9eef80"/>
    </linearGradient>
    <pattern id="grid-resume-forge" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#14160d" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g-resume-forge)"/>
  <rect width="800" height="500" fill="url(#grid-resume-forge)"/>

  <!-- decorative "document" stack on the right -->
  <g transform="translate(500 90)">
    <rect x="20" y="20" width="220" height="290" rx="6" fill="#fff4ec" stroke="#14160d" stroke-width="4" transform="rotate(-4 130 165)"/>
    <rect x="0"  y="0"  width="220" height="290" rx="6" fill="#fff4ec" stroke="#14160d" stroke-width="4"/>
    <rect x="20" y="30" width="120" height="10" fill="#14160d"/>
    <rect x="20" y="55" width="180" height="6"  fill="#14160d" opacity="0.5"/>
    <rect x="20" y="70" width="140" height="6"  fill="#14160d" opacity="0.5"/>
    <rect x="20" y="100" width="80"  height="6" fill="#14160d" opacity="0.35"/>
    <rect x="20" y="115" width="180" height="6" fill="#14160d" opacity="0.35"/>
    <rect x="20" y="130" width="160" height="6" fill="#14160d" opacity="0.35"/>
    <rect x="20" y="155" width="80"  height="6" fill="#14160d" opacity="0.35"/>
    <rect x="20" y="170" width="180" height="6" fill="#14160d" opacity="0.35"/>
    <rect x="20" y="185" width="150" height="6" fill="#14160d" opacity="0.35"/>
    <!-- lime rubric bar -->
    <rect x="20" y="220" width="180" height="14" fill="#d1e030" stroke="#14160d" stroke-width="3"/>
    <rect x="20" y="240" width="180" height="14" fill="#9eef80" stroke="#14160d" stroke-width="3"/>
    <rect x="20" y="260" width="120" height="14" fill="#fbd535" stroke="#14160d" stroke-width="3"/>
  </g>

  <!-- text plate -->
  <g font-family="'Oswald','Arial Narrow',Impact,sans-serif">
    <text x="60" y="220" fill="#14160d" opacity="0.7" font-size="14" letter-spacing="4" font-family="'JetBrains Mono',monospace">SAQLAINAP · ARENA</text>
    <text x="60" y="290" fill="#14160d" font-size="70" font-weight="700">RESUME-FORGE</text>
    <text x="60" y="330" fill="#14160d" opacity="0.85" font-size="22" font-family="'JetBrains Mono',monospace">offline, ATS-safe résumé builder</text>
    <rect x="60" y="360" width="80" height="5" fill="#14160d"/>
  </g>
</svg>
