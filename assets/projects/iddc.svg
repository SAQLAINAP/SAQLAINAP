<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-iddc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid-iddc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#14160d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g-iddc)"/>
  <rect width="800" height="500" fill="url(#grid-iddc)"/>

  <!-- degradation-tier ladder on the right -->
  <g transform="translate(460 80)" stroke="#14160d" stroke-width="4">
    <!-- YAML card -->
    <g>
      <rect x="0" y="0" width="200" height="230" rx="6" fill="#14160d"/>
      <g font-family="'JetBrains Mono',monospace" font-size="11" stroke="none">
        <text x="14" y="26" fill="#9eef80">service:</text>
        <text x="74" y="26" fill="#fbd535">api-gateway</text>
        <text x="14" y="46" fill="#9eef80">tiers:</text>
        <text x="14" y="66" fill="#22d3ee">- nominal</text>
        <text x="14" y="86" fill="#22d3ee">- warm</text>
        <text x="30" y="102" fill="#fff4ec" opacity="0.7">disable: [reco]</text>
        <text x="14" y="122" fill="#fbd535">- critical</text>
        <text x="30" y="138" fill="#fff4ec" opacity="0.7">mode: read_only</text>
        <text x="30" y="154" fill="#fff4ec" opacity="0.7">human_gate: 45s</text>
        <text x="14" y="174" fill="#ec4899">- survival</text>
        <text x="30" y="190" fill="#fff4ec" opacity="0.7">mode: fallback</text>
        <text x="14" y="214" fill="#9eef80" opacity="0.5">// compiled → .dg</text>
      </g>
    </g>

    <!-- tier ladder to the right -->
    <g transform="translate(220 10)">
      <!-- nominal -->
      <rect x="0" y="0"   width="90" height="40" fill="#9eef80"/>
      <text x="45" y="26" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="14" font-weight="700" fill="#14160d" stroke="none">NOMINAL</text>
      <!-- warm -->
      <rect x="0" y="50"  width="90" height="40" fill="#d1e030"/>
      <text x="45" y="76" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="14" font-weight="700" fill="#14160d" stroke="none">WARM</text>
      <!-- critical -->
      <rect x="0" y="100" width="90" height="40" fill="#fbd535"/>
      <text x="45" y="126" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="14" font-weight="700" fill="#14160d" stroke="none">CRITICAL</text>
      <!-- survival -->
      <rect x="0" y="150" width="90" height="40" fill="#ec4899"/>
      <text x="45" y="176" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="14" font-weight="700" fill="#14160d" stroke="none">SURVIVAL</text>
      <!-- arrow -->
      <g stroke="none" fill="#14160d">
        <path d="M45 200 L45 210 L35 210 L45 224 L55 210 L45 210 Z"/>
      </g>
    </g>
  </g>

  <!-- text plate -->
  <g font-family="'Oswald','Arial Narrow',Impact,sans-serif">
    <text x="60" y="220" fill="#14160d" opacity="0.75" font-size="14" letter-spacing="4" font-family="'JetBrains Mono',monospace">SAQLAINAP · ARENA</text>
    <text x="60" y="290" fill="#fff4ec" font-size="70" font-weight="700">IDDC</text>
    <text x="60" y="330" fill="#14160d" opacity="0.9" font-size="22" font-family="'JetBrains Mono',monospace">degrade on purpose, not panic</text>
    <rect x="60" y="360" width="80" height="5" fill="#14160d"/>
  </g>
</svg>
