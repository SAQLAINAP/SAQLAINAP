<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Saqlain Ahmed P: Forward Deployed Engineer at Plivo, building Voice AI, RAG and agentic systems">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#fff4ec" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; }

      .rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) backwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
      .d4 { animation-delay: .9s; } .d5 { animation-delay: 1.1s; } .d6 { animation-delay: 1.3s; } .d7 { animation-delay: 1.5s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

      .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) backwards; }
      @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25; } }

      .ticker { animation: scroll 22s linear infinite; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1200px); } }

      @media (prefers-reduced-motion: reduce) {
        .rise, .pop { animation: none; }
        .cursor, .dot, .ticker { animation: none; }
      }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="400" fill="#14160d"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- main card: hard offset shadow + thick border -->
  <g class="rise d1">
    <rect x="52" y="52" width="700" height="264" fill="#fbd535"/>
    <rect x="40" y="40" width="700" height="264" fill="#fff4ec" stroke="#14160d" stroke-width="4"/>
    <!-- window chrome -->
    <rect x="40" y="40" width="700" height="34" fill="#14160d"/>
    <circle cx="62" cy="57" r="6" fill="#ff5c5c"/>
    <circle cx="82" cy="57" r="6" fill="#fbd535"/>
    <circle cx="102" cy="57" r="6" fill="#d1e030"/>
    <text x="390" y="62" text-anchor="middle" class="mono" font-size="13" fill="#fff4ec" fill-opacity=".7">~/saqlainap — zsh</text>
  </g>

  <g class="rise d2">
    <rect x="68" y="92" width="238" height="26" fill="#14160d"/>
    <circle class="dot" cx="84" cy="105" r="5" fill="#d1e030"/>
    <text x="98" y="110" class="mono" font-size="13" font-weight="700" fill="#d1e030" letter-spacing="1">ONLINE · BANGALORE, IN</text>
  </g>

  <text x="66" y="186" class="sans rise d3" font-size="64" fill="#14160d" textLength="640" lengthAdjust="spacingAndGlyphs">SAQLAIN AHMED P</text>

  <g class="rise d4">
    <rect x="68" y="204" width="470" height="36" fill="#d1e030" stroke="#14160d" stroke-width="3"/>
    <text x="84" y="229" class="mono" font-size="17" font-weight="700" fill="#14160d" textLength="440" lengthAdjust="spacingAndGlyphs">FORWARD DEPLOYED ENGINEER @ PLIVO</text>
  </g>

  <g class="rise d5">
    <text x="68" y="280" class="mono" font-size="17" fill="#14160d">
      <tspan fill="#8a8a7a">$</tspan> building voice AI, RAG &amp; agentic systems<tspan class="cursor" font-weight="700"> ▍</tspan>
    </text>
  </g>

  <!-- stickers -->
  <g transform="translate(800 56) rotate(-4)">
    <g class="pop d4">
      <rect x="8" y="8" width="340" height="70" fill="#fff4ec"/>
      <rect x="0" y="0" width="340" height="70" fill="#d1e030" stroke="#14160d" stroke-width="4"/>
      <text x="22" y="47" class="sans" font-size="30" fill="#14160d">8×</text>
      <text x="84" y="32" class="mono" font-size="14" font-weight="700" fill="#14160d">HACKATHON</text>
      <text x="84" y="52" class="mono" font-size="14" font-weight="700" fill="#14160d">WINNER</text>
    </g>
  </g>

  <g transform="translate(850 150) rotate(3)">
    <g class="pop d5">
      <rect x="8" y="8" width="300" height="64" fill="#d1e030"/>
      <rect x="0" y="0" width="300" height="64" fill="#fbd535" stroke="#14160d" stroke-width="4"/>
      <text x="20" y="28" class="mono" font-size="13" font-weight="700" fill="#14160d">LINUX FOUNDATION</text>
      <text x="20" y="50" class="sans" font-size="19" fill="#14160d">SCHOLAR ×2</text>
    </g>
  </g>

  <g transform="translate(790 236) rotate(-2)">
    <g class="pop d6">
      <rect x="8" y="8" width="170" height="60" fill="#fbd535"/>
      <rect x="0" y="0" width="170" height="60" fill="#fff4ec" stroke="#14160d" stroke-width="4"/>
      <text x="18" y="26" class="mono" font-size="12" font-weight="700" fill="#14160d">CNCF</text>
      <text x="18" y="48" class="sans" font-size="20" fill="#14160d">KCNA ✓</text>
    </g>
  </g>

  <g transform="translate(990 238) rotate(4)">
    <g class="pop d7">
      <rect x="8" y="8" width="150" height="60" fill="#fff4ec"/>
      <rect x="0" y="0" width="150" height="60" fill="#14160d" stroke="#fff4ec" stroke-width="3"/>
      <text x="16" y="26" class="mono" font-size="12" font-weight="700" fill="#fbd535">B.E. AI/ML</text>
      <text x="16" y="48" class="sans" font-size="20" fill="#fff4ec">9.25 CGPA</text>
    </g>
  </g>

  <!-- ticker -->
  <rect x="0" y="342" width="1200" height="58" fill="#fbd535"/>
  <rect x="0" y="342" width="1200" height="4" fill="#14160d"/>
  <g class="ticker">
    <text xml:space="preserve" x="0" y="380" class="sans" font-size="20" fill="#14160d" textLength="1200" lengthAdjust="spacing">VOICE AI ✦ RAG ✦ AGENTIC SYSTEMS ✦ MCP ✦ CLOUD NATIVE ✦ KUBERNETES ✦ FULL STACK ✦ </text>
    <text xml:space="preserve" x="1200" y="380" class="sans" font-size="20" fill="#14160d" textLength="1200" lengthAdjust="spacing">VOICE AI ✦ RAG ✦ AGENTIC SYSTEMS ✦ MCP ✦ CLOUD NATIVE ✦ KUBERNETES ✦ FULL STACK ✦ </text>
  </g>
</svg>
