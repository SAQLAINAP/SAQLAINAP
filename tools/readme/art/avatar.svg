<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pixel-art avatar for saqlainap — 24x24 grid, rendered with
  shape-rendering="crispEdges" so every "pixel" stays sharp when the SVG
  is scaled up into the hero disc. Palette matches the Montgomery brutalist
  system (lime + ink + cream + skin tones + hoodie in ink).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">
  <!-- background disc-tint (drawn as a full 24x24 square; the outer <img>
       clips it inside the rounded disc frame) -->
  <rect width="24" height="24" fill="#9eef80"/>

  <!-- soft radial vignette to give the pfp some depth -->
  <rect x="0"  y="0"  width="24" height="4" fill="#8fd873" opacity="0.6"/>
  <rect x="0"  y="20" width="24" height="4" fill="#88cc6b" opacity="0.55"/>

  <!-- ==============  hair (top) — dark curly cap ==================== -->
  <g fill="#1a1a12">
    <rect x="6"  y="3" width="12" height="1"/>
    <rect x="5"  y="4" width="14" height="1"/>
    <rect x="4"  y="5" width="16" height="2"/>
    <rect x="4"  y="7" width="2"  height="2"/>
    <rect x="18" y="7" width="2"  height="2"/>
  </g>
  <!-- little curly highlights on the hair -->
  <g fill="#3a3a25">
    <rect x="7"  y="4" width="1" height="1"/>
    <rect x="11" y="3" width="1" height="1"/>
    <rect x="15" y="4" width="1" height="1"/>
    <rect x="5"  y="6" width="1" height="1"/>
    <rect x="18" y="6" width="1" height="1"/>
  </g>

  <!-- ==============  face — warm brown skin ========================= -->
  <g fill="#c8875a">
    <rect x="6"  y="7"  width="12" height="1"/>
    <rect x="5"  y="8"  width="14" height="1"/>
    <rect x="5"  y="9"  width="14" height="1"/>
    <rect x="5"  y="10" width="14" height="1"/>
    <rect x="5"  y="11" width="14" height="1"/>
    <rect x="5"  y="12" width="14" height="1"/>
    <rect x="6"  y="13" width="12" height="1"/>
    <rect x="7"  y="14" width="10" height="1"/>
    <rect x="8"  y="15" width="8"  height="1"/>
  </g>

  <!-- face shading on the right side -->
  <g fill="#a06d43" opacity="0.55">
    <rect x="17" y="8"  width="2" height="7"/>
    <rect x="16" y="14" width="1" height="1"/>
  </g>

  <!-- ==============  glasses (JetBrains-mono energy) ================ -->
  <g fill="#1a1a12">
    <!-- left frame -->
    <rect x="7"  y="9"  width="4" height="1"/>
    <rect x="7"  y="10" width="1" height="2"/>
    <rect x="10" y="10" width="1" height="2"/>
    <rect x="7"  y="12" width="4" height="1"/>
    <!-- right frame -->
    <rect x="13" y="9"  width="4" height="1"/>
    <rect x="13" y="10" width="1" height="2"/>
    <rect x="16" y="10" width="1" height="2"/>
    <rect x="13" y="12" width="4" height="1"/>
    <!-- bridge -->
    <rect x="11" y="10" width="2" height="1"/>
  </g>
  <!-- lime lens tint (peek of code reflection) -->
  <g fill="#d1e030">
    <rect x="8"  y="10" width="2" height="2"/>
    <rect x="14" y="10" width="2" height="2"/>
  </g>
  <!-- tiny white highlight per lens -->
  <g fill="#ffffff">
    <rect x="9"  y="10" width="1" height="1"/>
    <rect x="15" y="10" width="1" height="1"/>
  </g>

  <!-- ==============  eyebrows (over glasses top edge) ================ -->
  <g fill="#1a1a12">
    <rect x="7"  y="8" width="4" height="1"/>
    <rect x="13" y="8" width="4" height="1"/>
  </g>

  <!-- ==============  mouth — subtle smirk =========================== -->
  <g fill="#5a3520">
    <rect x="10" y="14" width="4" height="1"/>
    <rect x="14" y="13" width="1" height="1"/>
  </g>

  <!-- ==============  neck ============================================ -->
  <g fill="#a06d43">
    <rect x="10" y="16" width="4" height="1"/>
  </g>

  <!-- ==============  hoodie (ink), lime cord + brand chip ========== -->
  <g fill="#14160d">
    <rect x="3"  y="17" width="18" height="7"/>
  </g>
  <!-- hoodie inner opening -->
  <g fill="#c8875a">
    <rect x="11" y="17" width="2"  height="1"/>
  </g>
  <!-- lime drawstrings + chip -->
  <g fill="#d1e030">
    <rect x="11" y="18" width="1" height="3"/>
    <rect x="12" y="18" width="1" height="3"/>
    <rect x="10" y="21" width="1" height="1"/>
    <rect x="13" y="21" width="1" height="1"/>
    <!-- "S" chip on the chest, our brand mark -->
    <rect x="16" y="20" width="3" height="3"/>
  </g>
  <g fill="#14160d">
    <rect x="17" y="21" width="1" height="1"/>
  </g>

  <!-- ==============  outline pass (crisp brutalist border) ========= -->
  <g fill="#14160d">
    <!-- hair outline -->
    <rect x="6"  y="2" width="12" height="1"/>
    <rect x="5"  y="3" width="1" height="1"/>
    <rect x="18" y="3" width="1" height="1"/>
    <rect x="4"  y="4" width="1" height="1"/>
    <rect x="19" y="4" width="1" height="1"/>
    <rect x="3"  y="5" width="1" height="2"/>
    <rect x="20" y="5" width="1" height="2"/>
    <!-- face side outlines -->
    <rect x="4"  y="7" width="1" height="6"/>
    <rect x="19" y="7" width="1" height="6"/>
    <rect x="5"  y="13" width="1" height="1"/>
    <rect x="18" y="13" width="1" height="1"/>
    <rect x="6"  y="14" width="1" height="1"/>
    <rect x="17" y="14" width="1" height="1"/>
    <rect x="7"  y="15" width="1" height="1"/>
    <rect x="16" y="15" width="1" height="1"/>
    <rect x="8"  y="16" width="2" height="1"/>
    <rect x="14" y="16" width="2" height="1"/>
  </g>
</svg>
